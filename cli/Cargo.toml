[package]
name = "deadchaps-reader"
version = "1.0.6"
description = "The DeadChaps Companion's game reader: reads Deadlock's match state, read-only, and reports it as JSON"
license-file = "../LICENSE.md"
edition = "2024"
publish = false

[[bin]]
name = "deadchaps-reader"
path = "src/main.rs"

[dependencies]
deadchaps-reader-core = { path = "../core", features = ["process"] }
serde_json = "1.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
